format = """
$directory$git_branch$git_status$php$nodejs$cmd_duration$line_break$character"""

# ==============================================================================
# Directory
# ==============================================================================
[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

# ==============================================================================
# Git
# ==============================================================================
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
stashed = "$${count}"

# ==============================================================================
# Languages (only shown when relevant files are present)
# ==============================================================================
[php]
symbol = " "
style = "bold blue"
format = "[$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version)]($style) "

# Disable languages not in use
[python]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

# ==============================================================================
# Command duration (show if > 2s)
# ==============================================================================
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

# ==============================================================================
# Prompt character
# ==============================================================================
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
