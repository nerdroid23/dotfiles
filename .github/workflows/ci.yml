name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck .sh files
        run: shellcheck -x install.sh uninstall.sh sync.sh migrate-volta-to-mise.sh macos.sh lib/*.sh

      - name: Syntax check
        run: |
          for f in install.sh uninstall.sh sync.sh migrate-volta-to-mise.sh macos.sh lib/*.sh; do
            bash -n "$f"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Run tests
        run: bats tests/*.bats
